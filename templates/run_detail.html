{% extends "base.html" %}
{% block title %}Run {{ run_id }}{% endblock %}
{% block content %}
<div class="p-4" data-run-id="{{ run_id }}">
  <p class="text-slate-400">執行視圖在 P5 實作。目前先用串流測試：</p>
  <pre id="log" class="mt-3 max-h-[70vh] overflow-auto rounded bg-slate-950 p-3 text-xs"></pre>
</div>
{% endblock %}
{% block scripts %}
<script>
const runId = document.querySelector('[data-run-id]').dataset.runId;
const log = document.getElementById('log');
const es = new EventSource(`/api/runs/${runId}/events`);
es.onmessage = (e) => {
  const ev = JSON.parse(e.data);
  log.textContent += `[${ev.seq}] ${ev.node_id || '-'} ${ev.kind}: ${ev.text}\n`;
  log.scrollTop = log.scrollHeight;
};
es.addEventListener('done', (e) => {
  log.textContent += `\n=== ${e.data} ===\n`;
  es.close();
});
</script>
{% endblock %}
