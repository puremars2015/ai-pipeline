{% extends "base.html" %}
{% block title %}Run {{ run_id }}{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='vendor/drawflow.min.css') }}">
{% endblock %}

{% block content %}
<div class="flex h-[calc(100vh-53px)]" data-run-id="{{ run_id }}" data-project-id="{{ project_id }}">

  <section class="flex min-w-0 flex-1 flex-col">
    <div class="flex flex-wrap items-center gap-2 border-b border-slate-700 px-3 py-2 text-sm">
      <span id="run-status" class="rounded px-2 py-0.5 text-xs">…</span>
      <span id="run-name" class="font-medium"></span>
      <code id="run-branch" class="text-xs text-slate-500"></code>
      <button id="btn-cancel" class="hidden rounded border border-rose-800 px-2 py-1 text-xs text-rose-300 hover:bg-rose-950">取消</button>
      <a href="/?project={{ project_id }}" class="ml-auto text-xs text-slate-400 hover:text-slate-100">← 回編輯器</a>
    </div>

    <div id="run-reason" class="hidden border-b border-slate-700 px-3 py-2 text-xs"></div>
    <div id="canvas" class="min-h-0 flex-1"></div>

    <div class="flex-none border-t border-slate-700 px-3 py-2">
      <div class="mb-1 text-[11px] uppercase tracking-wide text-slate-500">需求</div>
      <div id="run-requirement" class="max-h-16 overflow-y-auto text-xs text-slate-300"></div>
    </div>
  </section>

  <aside class="flex w-[30rem] flex-none flex-col border-l border-slate-700">
    <div class="flex flex-none gap-1 border-b border-slate-700 px-2 py-1.5 text-xs">
      <button class="tab tab-on" data-tab="timeline">時間軸</button>
      <button class="tab" data-tab="node">節點</button>
      <button class="tab" data-tab="diff">變更</button>
      <button class="tab" data-tab="artifacts">產物</button>
      <label class="ml-auto flex items-center gap-1 text-slate-400">
        <input type="checkbox" id="show-noise" class="accent-sky-600"> 顯示原始輸出
      </label>
    </div>

    <div id="pane-timeline" class="pane min-h-0 flex-1 overflow-y-auto p-2"></div>
    <div id="pane-node" class="pane hidden min-h-0 flex-1 overflow-y-auto p-3">
      <p class="text-sm text-slate-500">點畫布上的節點看它的輸出。</p>
    </div>
    <div id="pane-diff" class="pane hidden min-h-0 flex-1 overflow-y-auto p-3"></div>
    <div id="pane-artifacts" class="pane hidden min-h-0 flex-1 overflow-y-auto p-3"></div>
  </aside>

</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='vendor/drawflow.min.js') }}"></script>
<script type="module" src="{{ url_for('static', filename='js/run.js') }}"></script>
{% endblock %}
